<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leitura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
/* =========================================================
   Leitura — design system (inspirado no iOS / Apple News)
   ========================================================= */
:root{
  --bg:#f2f2f7; --bg2:#e9e9ef; --card:#ffffff; --card2:#f7f7fa; --fill:rgba(118,118,128,.12);
  --ink:#1c1c1e; --ink2:rgba(60,60,67,.82); --muted:rgba(60,60,67,.56); --faint:rgba(60,60,67,.3);
  --line:rgba(60,60,67,.14); --accent:#ff5b36; --accent-soft:rgba(255,91,54,.12); --accent2:#7b5cff;
  --glass:rgba(242,242,247,.78); --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);
  --read-size:19px; --r:14px; --r-lg:22px;
  --ease:cubic-bezier(.32,.72,0,1);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;
  --serif:Newsreader,"New York",Georgia,serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#000; --bg2:#1c1c1e; --card:#1c1c1e; --card2:#2c2c2e; --fill:rgba(118,118,128,.24);
  --ink:#f5f5f7; --ink2:rgba(235,235,245,.82); --muted:rgba(235,235,245,.55); --faint:rgba(235,235,245,.28);
  --line:rgba(84,84,88,.55); --accent:#ff6b4a; --accent-soft:rgba(255,107,74,.16);
  --glass:rgba(18,18,20,.72); --shadow:none;
}
[data-theme="sepia"]{
  --bg:#f3ebd9; --bg2:#eadfc6; --card:#fbf6ea; --card2:#f3ecdc; --fill:rgba(110,85,50,.1);
  --ink:#33281d; --ink2:rgba(60,45,30,.85); --muted:rgba(60,45,30,.58); --faint:rgba(60,45,30,.3);
  --line:rgba(60,45,30,.14); --accent:#c2552d; --accent-soft:rgba(194,85,45,.12);
  --glass:rgba(243,235,217,.82);
}
html.android{--st:max(env(safe-area-inset-top,0px),40px);--sb:max(env(safe-area-inset-bottom,0px),14px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.locked{overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
a{color:var(--accent)}
input,textarea{font:inherit;width:100%;padding:11px 14px;border:none;border-radius:12px;background:var(--fill);color:var(--ink);outline:none;-webkit-appearance:none}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{min-height:140px;resize:vertical}
svg{display:block}
.app{max-width:680px;margin:0 auto;min-height:100vh;padding:0 16px calc(96px + var(--sb))}
.view-in{animation:viewIn .32s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Cabeçalho com título grande + barra compacta ---------- */
header{padding:calc(14px + var(--st)) 0 6px}
.hd-top{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.hd-top small{font-size:13px;font-weight:600;color:var(--muted)}
.hd-actions{display:flex;gap:6px}
header h1{margin:2px 0 0;font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.9px;line-height:1.1}
.ibtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--fill);transition:transform .15s var(--ease),opacity .15s}
.ibtn:active{transform:scale(.9);opacity:.7}
.ibtn svg{width:18px;height:18px}
.topbar{position:fixed;top:0;left:0;right:0;z-index:12;padding-top:var(--st);height:calc(44px + var(--st));display:flex;align-items:center;justify-content:center;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line);opacity:0;pointer-events:none;transition:opacity .2s}
.topbar.show{opacity:1;pointer-events:auto}
.topbar b{font-size:16px;font-weight:700;letter-spacing:-.2px}
.statusfill{position:fixed;top:0;left:0;right:0;height:var(--st);background:var(--bg);z-index:11}
.search{position:relative;margin:4px 0 6px;display:none}
.search.open{display:block}
.search input{padding-left:38px;height:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;color:var(--muted)}
.ptr{height:0;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px;font-weight:600;transition:height .25s var(--ease)}
.ptr.on{height:44px}
.spin{width:20px;height:20px;border:2px solid var(--faint);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Barra de separadores (tab bar) ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:6px 8px calc(4px + var(--sb));background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);transition:transform .35s var(--ease)}
nav.hide{transform:translateY(100%)}
nav button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;font-size:10.5px;font-weight:600;color:var(--muted);transition:color .15s}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--accent)}

/* ---------- Controlo segmentado, chips, botões ---------- */
.seg{position:relative;display:flex;background:var(--fill);border-radius:9px;padding:2px;margin:10px 0}
.seg button{flex:1;position:relative;z-index:1;height:30px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink);transition:background .2s,box-shadow .2s}
.seg button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.08),0 1px 1px rgba(0,0,0,.04)}
[data-theme="dark"] .seg button.on{background:#636366}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar,.themes::-webkit-scrollbar,.carousel::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:99px;background:var(--fill);font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;transition:background .2s,color .2s}
.chip.on{background:var(--ink);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;background:var(--accent);color:#fff;transition:transform .15s var(--ease),opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.acc{background:var(--accent);color:#fff}
.btn.soft{background:var(--fill);color:var(--accent)}
.btn.block{width:100%}
.pill{height:30px;padding:0 13px;border-radius:99px;font-size:13px;font-weight:700;background:var(--fill);color:var(--accent);white-space:nowrap;display:inline-flex;align-items:center}
.pill.acc{background:var(--accent);color:#fff}
.pill.done{background:transparent;color:var(--muted)}
.x{color:var(--faint);font-size:22px;line-height:1;padding:4px 6px}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.inline .btn{height:42px}
.note{display:flex;gap:10px;font-size:13px;color:var(--ink2);background:var(--fill);border-radius:12px;padding:11px 13px;margin:12px 0}
.empty{text-align:center;color:var(--muted);padding:48px 24px;font-size:14.5px}
.empty .big{font-size:38px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.file{cursor:pointer}
label.file input{display:none}
.sub{color:var(--muted);font-size:13.5px;margin:0 4px 12px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 10px}
.sec h2{margin:0;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.4px}
.sec span,.sec .seeall{color:var(--accent);font-size:15px;font-weight:500}

/* ---------- Secções de temas (Hoje) ---------- */
.themes{position:sticky;top:calc(44px + var(--st));z-index:6;display:flex;gap:6px;overflow-x:auto;margin:4px -16px 0;padding:8px 16px;background:var(--bg);scrollbar-width:none}
.themes button{flex:none;height:32px;padding:0 14px;border-radius:99px;font-size:14px;font-weight:600;color:var(--ink2);background:var(--fill);transition:background .2s,color .2s}
.themes button.on{background:var(--ink);color:var(--bg)}
.feedbar{display:flex;align-items:center;gap:8px;margin:20px 0 4px}
.feedbar .seg{flex:1;margin:0}
.fbtn{position:relative;width:34px;height:34px;flex:none;border-radius:9px;background:var(--fill);display:grid;place-items:center;color:var(--ink)}
.fbtn svg{width:18px;height:18px}
.fbtn.active{background:var(--accent);color:#fff}
.activef{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.activef .chip{height:28px;font-size:12.5px;background:var(--accent-soft);color:var(--accent)}

/* ---------- Destaque (estilo Apple News) ---------- */
.hero{margin-top:14px;background:var(--card);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.hero:active,.mcard:active,.prow:active,.sq:active,.fcard:active{transform:scale(.98)}
.hero .media{aspect-ratio:16/10;position:relative;overflow:hidden;display:grid;place-items:center}
.hero .media.noimg{aspect-ratio:21/9}
.hero .media img,.mcover img,.thumb img,.rcover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .media .fav{width:64px;height:64px;border-radius:16px;background:#fff;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.hero .media .ini{font-family:var(--serif);font-size:64px;color:rgba(255,255,255,.92)}
.hero .hb{padding:14px 16px 16px}
.kicker{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kicker .acc{color:var(--accent)}
.hero h3{margin:6px 0 6px;font-family:var(--display);font-size:23px;font-weight:700;line-height:1.18;letter-spacing:-.5px}
.hero p{margin:0;color:var(--ink2);font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .meta{margin-top:10px;font-size:13px;color:var(--muted);font-weight:500}
.carousel,.featc,.pager,.sq-row,.nets,.flagrow,.related{scroll-padding-inline:16px}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.mcard{flex:none;width:236px;scroll-snap-align:start;background:var(--card);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .2s var(--ease)}
.mcover{aspect-ratio:16/10;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.9);font-family:var(--serif);font-size:40px}
.mbody{padding:10px 12px 14px}
.mbody b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;font-size:15px;font-weight:600;line-height:1.3;letter-spacing:-.2px}

/* ---------- Lista de artigos ---------- */
.group-h{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:22px 16px 7px}
.elist{background:var(--card);border-radius:var(--r);overflow:hidden}
.erow{position:relative;display:flex;gap:14px;padding:13px 16px;cursor:pointer;align-items:flex-start;background:var(--card);content-visibility:auto;contain-intrinsic-size:auto 108px;transition:background .15s}
.erow + .erow::after{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--line)}
.erow:active{background:var(--card2)}
.erow.read .etext h3{color:var(--muted)}
.erow.read .thumb{opacity:.55}
.etext{flex:1;min-width:0;display:flex;flex-direction:column}
.src{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink2);min-width:0}
.src .chl{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .when{color:var(--muted);font-weight:500;margin-left:auto;flex:none}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.fl{font-size:12px}
.chl{cursor:pointer}
.erow h3{margin:4px 0 8px;font-size:16.5px;font-weight:600;line-height:1.3;letter-spacing:-.25px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.thumb{flex:none;width:78px;height:78px;border-radius:10px;position:relative;overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.92);font-family:var(--serif);font-size:30px;margin-top:2px}
.foot{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;font-weight:500;min-width:0}
.foot .sp{flex:1}
.why{font-size:12.5px;font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.why.prio::before{content:"⚡ "}
.dup{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.bm{width:28px;height:28px;margin:-4px -6px -4px 0;display:grid;place-items:center;color:var(--faint);flex:none}
.bm.on{color:var(--accent)}
.bm svg{width:17px;height:17px}
.more{height:60px;display:grid;place-items:center}
.end{display:flex;flex-direction:column;align-items:center;gap:2px;padding:32px 20px 8px;text-align:center;color:var(--muted);font-size:13px}
.end b{font-size:15px;color:var(--ink2);font-weight:600}
/* gestos */
.erow{will-change:transform}
.erow.sw-r::before,.erow.sw-l::before{content:attr(data-swipe);position:absolute;top:0;bottom:0;width:130px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;opacity:.6;transition:opacity .15s}
.erow.sw-r::before{right:100%;background:var(--accent)}
.erow.sw-l::before{left:100%;background:#34c759}
.erow.sw-go::before{opacity:1}

/* ---------- Listas agrupadas (estilo Ajustes do iOS) ---------- */
.rows,.group{background:var(--card);border-radius:var(--r);overflow:hidden}
.rowi,.gi{position:relative;display:flex;align-items:center;gap:12px;min-height:48px;padding:9px 16px}
.rowi + .rowi::after,.gi + .gi::after{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--line)}
.rowi .grow,.gi .grow{flex:1;min-width:0}
.rowi b,.gi b{display:block;font-size:15.5px;font-weight:500}
.rowi small,.gi small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gi.link{cursor:pointer}
.gi.link:active{background:var(--card2)}
.gi .val{color:var(--muted);font-size:15px}
.gi .chev{color:var(--faint);font-size:20px;margin-left:2px}
.gi.danger b{color:#ff3b30}
.ghead{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:22px 16px 7px}
.gfoot{font-size:12.5px;color:var(--muted);margin:7px 16px 0;line-height:1.4}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;font-size:14px}
.switch{position:relative;width:51px;height:31px;flex:none;border-radius:99px;background:var(--fill);transition:background .25s var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:transform .25s var(--ease)}
.switch.on{background:#34c759}
.switch.on::after{transform:translateX(20px)}
.opts{display:flex;background:var(--fill);border-radius:9px;padding:2px;width:100%}
.opts button{flex:1;height:32px;border-radius:7px;font-size:13px;font-weight:600;transition:background .2s}
.opts button.on{background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.08)}
[data-theme="dark"] .opts button.on{background:#636366}
.gi.col{flex-direction:column;align-items:stretch;gap:8px;padding:12px 16px}

/* ---------- Leitor ---------- */
.reader,.chan{position:fixed;inset:0;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translate3d(100%,0,0);transition:transform .45s var(--ease);will-change:transform}
.reader{z-index:20}.chan{z-index:19}
.reader.open,.chan.open{transform:none}
.progress{position:fixed;top:var(--st);left:0;right:0;height:2px;z-index:3}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
.rbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(8px + var(--st)) 14px 8px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--line)}
.rbar .grp{display:flex;gap:8px}
.rwrap{max-width:680px;margin:0 auto;padding:18px 20px calc(110px + var(--sb))}
.rcover{aspect-ratio:16/9;border-radius:var(--r);position:relative;overflow:hidden;margin-bottom:18px;display:grid;place-items:center}
.rcover .ini{font-family:var(--serif);font-size:64px;color:rgba(255,255,255,.9)}
.rmeta{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink2);flex-wrap:wrap}
.rmeta .chl{display:inline-flex;align-items:center;gap:6px;color:var(--accent)}
.rwrap h1{font-family:var(--serif);font-weight:600;font-size:31px;line-height:1.16;letter-spacing:-.5px;margin:10px 0 14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tg{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.tg.prio{background:var(--accent);color:#fff}
.box{border-radius:var(--r);padding:16px 18px;margin:16px 0}
.box h4{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px;color:var(--accent)}
.box.sum{background:var(--card)}
.box.sum ul{margin:0;padding:0;list-style:none}
.box.sum li{position:relative;padding-left:16px;margin:8px 0;font-size:15.5px;line-height:1.5}
.box.sum li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.box.ans{background:var(--accent-soft)}
.box.ans .q{font-weight:700;font-size:13.5px;margin-top:10px}
.box.ans .q:first-of-type{margin-top:0}
.box.ans .a{font-family:var(--serif);font-size:17px;line-height:1.5;margin-top:2px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:26px 0 16px}
.divider::before,.divider::after{content:"";flex:1;height:.5px;background:var(--line)}
.rbody{font-family:var(--serif);font-size:var(--read-size);line-height:1.68;color:var(--ink)}
.rbody p{margin:0 0 1.05em}
mark.kw{background:none;color:inherit;box-shadow:inset 0 -.32em 0 var(--accent-soft)}
mark.hl{background:rgba(255,214,10,.42);color:inherit;border-radius:3px;padding:0 1px}
[data-theme="dark"] mark.hl{background:rgba(255,214,10,.3)}
.fullbar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px 10px 14px;margin:-4px 0 18px;font-size:13px;color:var(--ink2)}
.alsoin{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-6px 0 16px;font-size:13px;color:var(--muted)}
.alsoin .pill{height:26px;font-size:12px}
.nextcard{margin:26px 0 8px;padding:16px 18px;border-radius:var(--r);background:var(--card);cursor:pointer}
.nextcard small{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.nextcard b{display:block;font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.3;margin:5px 0 3px}
.nextcard span{font-size:12.5px;color:var(--muted)}
.related{display:flex;gap:10px;overflow-x:auto;margin:0 -20px;padding:0 20px 8px;scrollbar-width:none}
.related .rc{flex:none;width:220px;background:var(--card);border-radius:var(--r);padding:13px 14px;cursor:pointer}
.related .rc b{display:block;font-size:14.5px;font-weight:600;line-height:1.3;margin-top:5px}

// manter só o que interessa: últimos 30 dias (e até 700 artigos), mais guardados e destacados
function prune(max = 700){
  const keep = new Set([...Object.keys(S.saved), ...S.highlights.map(x => x.articleId)]);
  const cut = Date.now() - 30 * DAY;
  S.articles = S.articles.filter(a => keep.has(a.id) || a.date > cut).sort((a, b) => b.date - a.date);
  if (S.articles.length > max) S.articles = S.articles.filter((a, i) => i < max || keep.has(a.id));
  const ids = new Set(S.articles.map(a => a.id));
  for (const k of Object.keys(S.read)) if (!ids.has(k)) delete S.read[k];
}

/* ================= Texto ================= */
const STOP = new Set('para como com sem que uma umas uns por pelo pela pelos pelas mais menos dos das nos nas aos sobre entre quando onde quem qual quais isto isso este esta esse essa muito muita melhor melhores novas novos nova novo dicas coisas fazer ter ser está são foi tem criar porque depois antes ainda também mesmo cada todo toda todos todas seus suas pode podem entre desde'.split(' '));
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const stem = w => w.length < 5 ? w : w.replace(/coes$/, 'cao').replace(/oes$/, 'ao').replace(/eis$/, 'el').replace(/ais$/, 'al').replace(/s$/, '');
const words = t => norm(t).split(/[^a-z0-9]+/).filter(Boolean);
const keywords = t => [...new Set(words(t).filter(w => w.length > 3 && !STOP.has(w)).map(stem))];
const hits = (t, kws) => { const ws = words(t).map(stem); return kws.filter(k => ws.some(w => w.startsWith(k))); };
const sentences = t => t.replace(/\n+/g, ' ').split(/(?<=[.!?])\s+/).map(s => s.trim()).filter(s => s.length > 20 && !isJunk(s) && !JUNK_TAIL.test(s));
const readMin = t => Math.max(1, Math.round(words(t).length / 220));
const normCache = new Map();
const normText = a => { let v = normCache.get(a.id); if (v === undefined || v.l !== a.content.length){ v = { t: norm(a.title + ' ' + a.content), l: a.content.length }; normCache.set(a.id, v); } return v.t; };
const isMuted = a => S.muted.length > 0 && S.muted.some(m => m && normText(a).includes(norm(m)));
let fidCache = null, fidKey = '';
const followedIds = () => { const k = S.sources.map(s => s.id).join(); if (k !== fidKey){ fidKey = k; fidCache = new Set(S.sources.map(s => s.id)); } return fidCache; };

const cache = new Map();
function analyse(a){
  const ck = a.id + '|' + a.content.length + '|' + S.interests.map(i => i.text + i.prio).join();
  if (cache.has(ck)) return cache.get(ck);
  const ints = S.interests.map(i => ({ ...i, kws: keywords(i.text) }));
  const allK = [...new Set(ints.flatMap(i => i.kws))];
  const matched = []; let score = 0;
  for (const i of ints){
    const s = (hits(a.title, i.kws).length * 3 + hits(a.content, i.kws).length) * (i.prio ? 1.6 : 1);
    if (s > 0){ matched.push({ id: i.id, text: i.text, prio: i.prio, kws: i.kws }); score += s; }
  }
  const sents = sentences(a.content);
  const summary = sents.map((s, idx) => ({ s, idx, v: hits(s, allK).length * 2 + (idx === 0 ? 1.5 : 0) + (idx === sents.length - 1 ? .5 : 0) }))
    .sort((x, y) => y.v - x.v).slice(0, 3).sort((x, y) => x.idx - y.idx).map(x => x.s);
  const answers = matched.map(m => {
    const best = sents.map(s => ({ s, v: hits(s, m.kws).length })).sort((x, y) => y.v - x.v)[0];
    return best && best.v ? { q: m.text, a: best.s } : null;
  }).filter(Boolean);
  const r = { score: Math.min(99, Math.round(score * 11)), matched, summary, answers, allK };
  cache.set(ck, r); return r;
}


/* ================= Limpeza do texto: publicidade e "leia mais" ================= */
// Linhas inteiras que são publicidade, chamadas para outras notícias ou pedidos para seguir/assinar
const JUNK_LINE = /^(publicidade|publicidad|pub\.?|advertisement|advertising|ad|anúncio|anuncio|patrocinado|conte[úu]do patrocinado|sponsored( content)?|promo(ção|cao)?|continua (após a|apos a|depois da) publicidade|continue (a ler|lendo) (após a|apos a|depois da) publicidade|a not[íi]cia continua (após a|apos a|depois da) publicidade|(artigo|texto|mat[ée]ria) continua (após a|apos a|depois da|abaixo da) publicidade|leia (também|tambem|mais)|ler (também|tambem|mais)|veja (também|tambem|mais)|vê também|saiba mais|read more|continue reading|related( articles| stories)?|relacionad[oa]s?|mais lidas|recomendado para (si|você|voce)|siga[- ]nos|segue[- ]nos|siga o|acompanhe (o|a|nos)|subscreva|assine|inscreva-se|receba (as|a) (not[íi]cias|newsletter)|newsletter|clique (aqui|no link)|toque aqui|partilhe|compartilhe|share( this)?|follow us|subscribe|sign up|download (the|our) app|baixe o app|descarregue a app)\b/i;
// Restos no fim de um parágrafo: "Leia mais", "[…]", "The post … appeared first on …"
const JUNK_TAIL = /\s*(\[\s*(…|\.\.\.|&hellip;)\s*\]|(…|\.\.\.)\s*(leia mais|ler mais|continue lendo|continuar a ler|read more|saiba mais|ver mais|mais informa[çc][õo]es)|(leia mais|ler mais|continue lendo|continuar a ler|continue reading|read more|saiba mais|ver mais|clique (aqui|para ler)[^.]*)\s*[.:»›→>]*)\s*$/i;
const JUNK_ANY = /(the post .{1,200} appeared first on .{1,120}|o post .{1,200} apareceu primeiro em .{1,120}|this (article|story) (was )?originally (appeared|published) on .{1,120})\.?\s*$/i;
const isJunk = p => { const t = p.trim(); return !t || (t.length < 140 && JUNK_LINE.test(t)) || /^[\s\W]*$/.test(t); };
function cleanText(text){
  return (text || '').split(/\n{2,}|\n/)
    .map(p => p.trim().replace(JUNK_ANY, '').replace(JUNK_TAIL, '').trim())
    // dentro do parágrafo: tirar frases curtas que são só chamadas ("Saiba mais no nosso site.", "Siga-nos…")
    .map(p => p.split(/(?<=[.!?»])\s+/).filter(s => !isJunk(s)).join(' ').replace(JUNK_TAIL, '').trim())
    .filter(p => !isJunk(p)).join('\n\n');
}
const CLEAN_V = 1;

/* ================= RSS ================= */
function htmlToText(h){
  const d = document.createElement('div');
  d.innerHTML = (h || '').replace(/<\/(p|div|h\d|li|blockquote)>/gi, '\n\n').replace(/<br\s*\/?>/gi, '\n');
  return d.textContent.replace(/\n{3,}/g, '\n\n').trim();
}
function firstImg(h){ const m = (h || '').match(/<img[^>]+src=["']([^"']+)/i); return m ? m[1] : ''; }
function parseFeed(xmlText, src){
  const xml = new DOMParser().parseFromString(xmlText, 'text/xml');
  if (xml.querySelector('parsererror')) throw new Error('XML inválido');
  const title = xml.querySelector('channel > title, feed > title')?.textContent?.trim();
  const items = [...xml.querySelectorAll('item, entry')].slice(0, 30).map(it => {
    const g = sel => it.getElementsByTagName(sel)[0]?.textContent || '';
    const raw = g('content:encoded') || g('content') || g('description') || g('summary');
    const linkEl = it.getElementsByTagName('link')[0];
    const link = linkEl?.getAttribute('href') || linkEl?.textContent || '';
    const enc = it.getElementsByTagName('enclosure')[0]?.getAttribute('url') || it.getElementsByTagName('media:content')[0]?.getAttribute('url') || it.getElementsByTagName('media:thumbnail')[0]?.getAttribute('url') || '';
    const d = Date.parse(g('pubDate') || g('updated') || g('published') || g('dc:date'));
    return { id: uid(), sourceId: src.id, title: htmlToText(g('title')), url: link.trim(), date: isNaN(d) ? Date.now() : d, content: cleanText(htmlToText(raw)), image: enc || firstImg(raw) };
  }).filter(a => a.title);
  return { title, items };
}
function addItems(items){
  let n = 0;
  const urls = new Set(S.articles.map(a => a.url)), titles = new Set(S.articles.map(a => a.title));
  for (const it of items) if (!(it.url && urls.has(it.url)) && !titles.has(it.title)){ S.articles.push(it); urls.add(it.url); titles.add(it.title); n++; }
  return n;
}
async function fetchFeed(src){
  // No app instalado (Tauri) este pedido passa pelo plugin HTTP e funciona.
  const res = await xfetch(src.url);
  return parseFeed(await res.text(), src);
}
async function refreshAll(silent){
  if (!silent) toast('A procurar novidades nos teus feeds…');
  let ok = 0, n = 0;

  await Promise.all(S.sources.map(async s => { try { const f = await fetchFeed(s); n += addItems(f.items); s.last = Date.now(); ok++; } catch(e){} }));

}

  for (const x of list) (x.r.score >= 40 ? g['Muito a ver contigo'] : x.r.score > 0 ? g['Pode interessar-te'] : g['Outras leituras']).push(x);

// No app instalado usa o plugin HTTP do Tauri (sem bloqueios de CORS). Aqui, no protótipo, falha e mostramos alternativas.
const xfetch = (url, opt) => (window.__TAURI__?.http?.fetch || fetch)(url, opt);
const looksUrl = q => /^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(q.trim());
async function discoverFeeds(siteUrl){
  // 1) a página diz onde está o feed (<link rel="alternate" type="application/rss+xml">)
  if (!/^https?:/.test(siteUrl)) siteUrl = 'https://' + siteUrl;
  const found = [];
  try {
    const html = await (await xfetch(siteUrl)).text();
    if (/<(rss|feed|rdf:RDF)[\s>]/i.test(html.slice(0, 600))) return [{ url: siteUrl, title: '' }];
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('link[rel~="alternate"]').forEach(l => {
      if (/rss|atom|xml/i.test(l.type || '')) found.push({ url: new URL(l.getAttribute('href'), siteUrl).href, title: l.title || doc.title });
    });
  } catch(e){ throw e; }
  // 2) caminhos comuns
  if (!found.length) for (const p of ['/feed', '/rss', '/rss.xml', '/feed.xml', '/atom.xml', '/index.xml']){
    try { const t = await (await xfetch(new URL(p, siteUrl).href)).text(); if (/<(rss|feed|rdf:RDF)[\s>]/i.test(t.slice(0, 600))) { found.push({ url: new URL(p, siteUrl).href, title: '' }); break; } } catch(e){}
  }
  return found;
}
async function webSearch(q){
  web = { q, state: 'loading', items: [] }; refreshDisc();
  try {
    if (looksUrl(q)){
      const f = await discoverFeeds(q.trim());
      web.items = f.map(x => ({ title: x.title || q, url: x.url, site: q, desc: 'Feed encontrado neste site.' }));
    } else {
      // diretório público do Feedly: procura feeds por tema ou nome
      const r = await (await xfetch(`https://cloud.feedly.com/v3/search/feeds?query=${encodeURIComponent(q)}&count=25&locale=pt`)).json();
      web.items = (r.results || []).map(x => ({ title: x.title, url: (x.feedId || '').replace(/^feed\//, ''), site: x.website, desc: x.description || '', subs: x.subscribers, lang: x.language }));
      // e os sites que aparecem no Google News para esse tema
      try {
        const g = await (await xfetch(gnewsUrl(S.settings.tc || 'PT', q))).text();
        const doc = new DOMParser().parseFromString(g, 'text/xml'); const seen = new Set(web.items.map(i => i.site));
        doc.querySelectorAll('item source').forEach(s => { const u = s.getAttribute('url'); if (u && !seen.has(u)){ seen.add(u); web.items.push({ title: s.textContent, url: '', site: u, desc: 'Encontrado no Google News — o app procura o feed ao seguir.' }); } });
      } catch(e){}
    }
    web.state = web.items.length ? 'ok' : 'empty';
  } catch(e){ web.state = 'offline'; }
  refreshDisc();
}
function refreshDisc(){ const r = $('#discRes'); if (r) r.innerHTML = discResults(); }
function webSection(){
  const q = dQuery.trim();
  const head = `<div class="websec">
    <div class="wh"><span>🌐</span><div class="grow"><b>Procurar na web</b><small>${looksUrl(q) ? 'Encontrar o feed RSS deste site' : 'Descobrir sites e blogs sobre “' + esc(q) + '”'}</small></div>
    <button class="pill acc" data-websearch>${web.state === 'loading' && web.q === q ? 'A procurar…' : 'Procurar'}</button></div>`;
  if (web.q !== q || !web.state) return head + '</div>';
  if (web.state === 'loading') return head + '<div class="wload"><i></i><i></i><i></i></div></div>';
  if (web.state === 'offline' && isApp) return head + '<p class="sub" style="margin:10px 0 0">Não foi possível pesquisar agora. Verifica a internet.</p></div>';
  if (web.state === 'offline') return head + `<div class="note" style="margin:10px 0 4px"><span>📡</span><span>No protótipo a internet está bloqueada. No app instalado, esta pesquisa procura no diretório do Feedly, nos sites do Google News e na própria página do site. Por agora, podes <a href="https://www.google.com/search?q=${encodeURIComponent(q + ' RSS feed')}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700">procurar no navegador ↗</a> e colar o link em “A seguir”.</span></div></div>`;
  if (web.state === 'empty') return head + '<p class="sub" style="margin:10px 0 0">Nada encontrado. Tenta outras palavras.</p></div>';
  return head + web.items.slice(0, 20).map((x, i) => `<div class="orow"><div class="av" style="${grad(PALETTE[i % PALETTE.length])}">${esc((x.title || x.site || '?').replace(/^https?:\/\/(www\.)?/, '')[0].toUpperCase())}</div>

    ${followed(x.url) ? '<span class="pill done">✓</span>' : `<button class="pill acc" data-webfollow="${i}">Seguir</button>`}</div>`).join('') + '</div>';
}
async function followWeb(i){

  x.url = url; addSource(url, x.title); refreshDisc();
}

const THEME_STEMS = Object.fromEntries(Object.entries(THEME_KW).map(([k, v]) => [k, [...new Set(v.split(' '))].map(stem)]));
function srcCats(s){ return s.cats || OUTLETS.find(o => o.url === s.url)?.cats || []; }
const themeCache = new Map();
function themeOf(a){
  if (themeCache.has(a.id)) return themeCache.get(a.id);
  const sc = srcCats(src(a.sourceId));
  let t;
  if (sc.length === 1 && sc[0] !== 'geral') t = sc[0];            // site especializado (ex.: InfoMoney → Finanças)
  else {
    const tw = words(a.title).map(stem), cw = words(a.content.slice(0, 1500)).map(stem);
    let best = null, bv = 0;
    for (const [k, kws] of Object.entries(THEME_STEMS)){
      const set = new Set(kws);
      const v = tw.filter(w => set.has(w)).length * 3 + cw.filter(w => set.has(w)).length;
      const bonus = sc.includes(k) ? 1 : 0;
      if (v + bonus > bv){ bv = v + bonus; best = k; }
    }
    t = bv >= 3 ? best : (sc.find(c => c !== 'geral') && bv >= 1 ? sc.find(c => c !== 'geral') : 'geral');
  }
  themeCache.set(a.id, t); return t;
}

// A mesma notícia em vários jornais aparece uma só vez, com "também em: …"
const dupOf = {}; const tokCache = new Map();
function dedupe(list){
  const toks = list.map(x => { let t = tokCache.get(x.a.id); if (!t){ t = new Set(keywords(x.a.title)); tokCache.set(x.a.id, t); } return t; });
  const keep = [], used = new Set();
  for (let i = 0; i < list.length; i++){
    if (used.has(i)) continue;
    const grp = [list[i]];
    for (let j = i + 1; j < list.length; j++){
      if (used.has(j) || list[j].a.sourceId === list[i].a.sourceId || Math.abs(list[j].a.date - list[i].a.date) > 3 * DAY) continue;
      const A = toks[i], B = toks[j]; if (A.size < 3 || B.size < 3) continue;
      let inter = 0; A.forEach(w => B.has(w) && inter++);
      if (inter / Math.min(A.size, B.size) >= 0.6 && inter >= 3){ grp.push(list[j]); used.add(j); }
    }
    keep.push(list[i]); dupOf[list[i].a.id] = grp.slice(1).map(x => x.a);
  }
  return keep;
}

// "Readability" simples: encontra o bloco com mais parágrafos e devolve o texto limpo
function extractArticle(html, base){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const image = doc.querySelector('meta[property="og:image"]')?.content || '';
  doc.querySelectorAll('script,style,noscript,nav,header,footer,aside,form,iframe,svg,button,ins,figcaption,.share,.social,.related,.newsletter,.comments,[class*="advert"],[class*="banner"],[class*="publicidade"],[class*="publicidad"],[class*="sponsor"],[class*="patrocin"],[class*="promo"],[class*="outbrain"],[class*="taboola"],[class*="read-more"],[class*="readmore"],[class*="leia-mais"],[class*="leia-tambem"],[class*="saiba-mais"],[class*="recommend"],[class*="paywall"],[id*="comment"],[id*="ad-"],[id^="ad"],[class^="ad-"],[class*=" ad-"],[class*="ads"],[data-ad],[aria-label*="ublicidade"],[aria-label*="dvertisement"]').forEach(n => n.remove());
  let best = doc.querySelector('article'), bestScore = 0;
  const score = el => [...el.querySelectorAll(':scope > p, :scope > div > p, :scope > section > p')].reduce((s, p) => s + Math.min(p.textContent.trim().length, 600), 0);
  if (best) bestScore = score(best) * 1.3;
  doc.querySelectorAll('main, article, section, div').forEach(el => { const s = score(el); if (s > bestScore){ bestScore = s; best = el; } });
  if (!best) return { text: '', image };
  const seen = new Set(), out = [];
  best.querySelectorAll('p, h2, h3, blockquote, li').forEach(el => {
    const t = el.textContent.replace(/\s+/g, ' ').trim();
    const min = el.tagName === 'LI' ? 30 : el.tagName[0] === 'H' ? 8 : 45;
    if (t.length < min || seen.has(t)) return; seen.add(t);
    if (el.tagName === 'LI' && el.closest('nav, ul.menu')) return;
    out.push(t);
  });
  return { text: cleanText(out.join('\n\n')), image };
}

function importXml(text, name, url){

    save(); render(); toast(`${n} feeds importados do OPML`); return;
  }
  let s = S.sources.find(x => url && x.url === url);
  const tmp = s || { id: uid(), name: name || 'Feed importado', url: url || '', color: PALETTE[S.sources.length % PALETTE.length] };
  const f = parseFeed(text, tmp);
  if (!s){ if (f.title && !name) tmp.name = f.title; S.sources.push(tmp); }

function addSource(url, name, color, cc, lang){
  if (!/^https?:\/\//.test(url)) url = 'https://' + url;

  const s = { id: uid(), name: name || host, url, color: color || PALETTE[S.sources.length % PALETTE.length], cc: cc || '', lang: lang || '' };
  S.sources.push(s); save(); render(); toast(`A seguir ${s.name}`);
  fetchFeed(s).then(f => { if (!name && f.title) s.name = f.title; const n = addItems(f.items); save(); render(); toast(`${n} artigos de ${s.name}`); })
    .catch(async () => { // talvez seja um site e não um feed: procurar o feed na página
      try { const f = (await discoverFeeds(url))[0]; if (f){ s.url = f.url; const r = await fetchFeed(s); if (r.title) s.name = r.title; addItems(r.items); save(); render(); toast(`Feed encontrado: ${s.name}`); } } catch(e){} });
}

  if (d.addfeed){ addSource(d.addfeed, d.name, d.color); return; }
  if (d.themeTab){ S.settings.cat = d.themeTab; limit = PAGE; save(); render(); const el = document.querySelector('.themes .on'); el && el.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); return; }
  if (d.gotheme){ tab = 'fontes'; fsub = 'descobrir'; dCat = d.gotheme === 'geral' ? 'geral' : d.gotheme; render(); window.scrollTo(0, 0); return; }
  if (d.full){ loadFull(d.full); return; }
  if (d.rate){ S.settings.rate = +d.rate; save(); settingsSheet(); if (speaking){ stopSpeak(); speak(); } return; }
  if (d.voice){ S.settings.voice = d.voice; save(); settingsSheet(); return; }
  if (d.toggle){ S.settings[d.toggle] = S.settings[d.toggle] === false; save(); settingsSheet(); render(); return; }
  if (d.net !== undefined){ dNet = d.net; render(); window.scrollTo(0, 0); return; }
  if (d.dcc){ dCc = d.dcc; render(); window.scrollTo(0, 0); return; }
  if ('dhome' in d){ dQuery = ''; dRegion = 'all'; dLang = 'all'; dGem = false; dCat = 'all'; dCc = ''; dNet = ''; render(); window.scrollTo(0, 0); return; }
  if ('regionsheet' in d){ sheet(`<h2>Regiões</h2><div class="stack" style="margin-top:12px">${['all', ...REGIONS].map(r => `<button class="btn ${dRegion === r ? 'acc' : 'soft'} block" data-pickregion="${r}">${r === 'all' ? '🌍 Todas as regiões' : r}</button>`).join('')}</div>`); return; }
  if (d.pickregion){ dRegion = d.pickregion; closeSheet(); render(); window.scrollTo(0, 0); return; }
  if ('closesheet' in d){ closeSheet(); return; }
  if ('unread' in d){ unreadOnly = !unreadOnly; limit = PAGE; if ($('#modal').classList.contains('open')) filterSheet(); render(); return; }
  if (d.fsub){ fsub = d.fsub; render(); return; }
  if (d.dcat){ dCat = d.dcat; render(); window.scrollTo(0, 0); return; }
  if ('websearch' in d){ webSearch(dQuery.trim()); return; }
  if (d.webfollow !== undefined){ followWeb(+d.webfollow); return; }
  if (d.region){ dRegion = d.region; render(); window.scrollTo(0, 0); return; }
  if (d.dlang){ dLang = d.dlang; render(); return; }
  if ('gemtoggle' in d){ dGem = !dGem; render(); window.scrollTo(0, 0); return; }
  if (d.country){ country = d.country; limit = PAGE; closeSheet(); render(); return; }
  if (d.follow !== undefined){ e.stopPropagation(); const o = OUTLETS[+d.follow];
    if (followed(o.url)){ S.sources = S.sources.filter(s => s.url !== o.url); toast(`Deixaste de seguir ${o.name}`); } else followOutlet(o);
    save(); const pos = [...document.querySelectorAll('.pager,.featc,.sq-row,.nets,.flagrow')].map(el => el.scrollLeft); keepScroll(render);
    [...document.querySelectorAll('.pager,.featc,.sq-row,.nets,.flagrow')].forEach((el, i) => el.scrollLeft = pos[i] || 0); return; }
  if (d.followcc){ let n = 0; d.ids.split(',').forEach(i => { if (followOutlet(OUTLETS[+i], true)) n++; }); save(); keepScroll(render); toast(`${flag(d.followcc)} A seguir ${n} jornais de ${cname(d.followcc)}`); return; }
  if (d.gnews){ const u = gnewsUrl(d.gnews); if (followed(u)) { toast('Já segues estas manchetes'); return; } S.sources.push({ id: uid(), name: `Manchetes · ${cname(d.gnews)}`, url: u, cc: d.gnews, color: PALETTE[S.sources.length % PALETTE.length] }); save(); keepScroll(render); toast(`${flag(d.gnews)} A seguir as manchetes de ${cname(d.gnews)}`); return; }
  if (d.tc){ S.settings.tq = $('#tq').value.trim(); S.settings.tc = d.tc; save(); keepScroll(render); return; }
  if (d.tsug){ S.settings.tq = d.tsug; save(); keepScroll(render); return; }
  if (d.themeSet !== undefined){ S.settings.theme = d.themeSet; applySettings(); save(); (current ? textSheet : settingsSheet)(); return; }
  if (d.size){ S.settings.size = +d.size; applySettings(); save(); (current ? textSheet : settingsSheet)(); return; }
  switch (t.id){
    case 'searchBtn': { const b = $('#searchBox'); b.classList.toggle('open'); if (b.classList.contains('open')){ tab = 'hoje'; render(); $('#q').focus(); } else { query = ''; $('#q').value = ''; render(); } break; }
    case 'refreshBtn': refreshAll(false); break;
    case 'settingsBtn': settingsSheet(); break;
    case 'filterBtn': filterSheet(); break;
    case 'refreshNow': closeSheet(); refreshAll(false); break;
    case 'resetAsk': sheet(`<h2>${isApp ? 'Apagar todos os dados?' : 'Repor exemplo?'}</h2><p class="sub" style="margin:8px 4px 16px">${isApp ? 'Perdes os feeds que segues, os guardados e os destaques. Não dá para desfazer.' : 'Os dados de exemplo voltam ao início.'}</p><div class="stack"><button class="btn block" style="background:#ff3b30" id="resetBtn">${isApp ? 'Apagar tudo' : 'Repor'}</button><button class="btn soft block" data-closesheet>Cancelar</button></div>`); break;
    case 'speakBtn': speak(); break;
    case 'sizeBtn': textSheet(); break;
    case 'sizeBtnOld': { const z = [17, 19, 21, 23]; S.settings.size = z[(z.indexOf(S.settings.size) + 1) % z.length]; applySettings(); save(); toast(`Tamanho do texto: ${S.settings.size}px`); break; }
    case 'followTopic': { const q = $('#tq').value.trim(), cc = S.settings.tc || 'PT'; if (!q) return toast('Escreve um tema primeiro'); const u = gnewsUrl(cc, q); if (followed(u)) return toast('Já segues este tema'); S.sources.push({ id: uid(), name: `${q} · ${cname(cc)}`, url: u, cc, topic: true, color: PALETTE[S.sources.length % PALETTE.length] }); S.settings.tq = ''; save(); render(); toast(`🔎 A seguir “${q}” em ${flag(cc)} ${cname(cc)}`); break; }
    case 'addSrc': { const u = $('#srcUrl').value.trim(); if (!u) return toast('Cola o link de um feed RSS'); addSource(u); break; }
    case 'pasteXml': xmlSheet(); break;
    case 'xSave': { const x = $('#xText').value.trim(); if (!x) return; try { importXml(x, $('#xName').value.trim(), $('#xUrl').value.trim()); closeSheet(); } catch(err){ toast('Não consegui ler esse XML. Confirma se copiaste a página toda.'); } break; }
    case 'addInt': { const v = $('#intText').value.trim(); if (!v) return; S.interests.push({ id: uid(), text: v, prio: false }); save(); render(); toast('✦ Interesse adicionado'); break; }
    case 'addMute': { const v = $('#muteText').value.trim(); if (!v) return; S.muted.push(v); save(); render(); toast(`🔇 “${v}” silenciado`); break; }
    case 'pasteBtn': pasteSheet(); break;
    case 'pSave': { const c = $('#pText').value.trim(); if (c.length < 40) return toast('Cola um texto um pouco maior'); const a = { id: uid(), sourceId: null, title: $('#pTitle').value.trim() || c.slice(0, 70) + '…', url: $('#pUrl').value.trim(), date: Date.now(), content: c }; S.articles.push(a); save(); closeSheet(); render(); openReader(a.id); break; }
    case 'copyAll': copy(S.articles.filter(a => S.saved[a.id]).map(toMd).join('\n---\n\n')); break;
    case 'copyHl': copy('# Destaques\n\n' + S.highlights.map(h => { const a = S.articles.find(x => x.id === h.articleId); return `> ${h.text}\n\n— ${a ? `*${a.title}* (${src(a.sourceId).name})` : ''}`; }).join('\n\n')); break;
    case 'exportOpml': copy(opml()); break;
    case 'markAll': S.articles.forEach(a => S.read[a.id] ||= Date.now()); save(); closeSheet(); render(); toast('Tudo marcado como lido'); break;
    case 'resetBtn': S = isApp ? starter() : demo(); cache.clear(); save(); applySettings(); closeSheet(); tab = 'hoje'; filter = 'all'; render(); toast('Dados de exemplo repostos'); break;
  }
});
document.addEventListener('change', async e => {
  if (e.target.id === 'fileIn' && e.target.files[0]){
    const f = e.target.files[0];
    try { importXml(await f.text(), '', ''); } catch(err){ toast('Este ficheiro não parece um feed RSS, Atom ou OPML.'); }
    e.target.value = '';
  }
});
document.addEventListener('keydown', e => {
  const map = { intText: 'addInt', srcUrl: 'addSrc', muteText: 'addMute' };
  if (e.key === 'Enter' && e.target.id === 'tq') $('#followTopic').click();
  if (e.key === 'Enter' && e.target.id === 'dq' && dQuery.trim().length >= 2) webSearch(dQuery.trim());
  if (e.key === 'Enter' && map[e.target.id]) $('#' + map[e.target.id]).click();
  if (e.key === 'Escape'){ if ($('#modal').classList.contains('open')) closeSheet(); else if (current) closeReader(); else if (chan) closeChan(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'dq'){ dQuery = e.target.value; const r = $('#discRes'); if (r) r.innerHTML = discResults(); }
  if (e.key === undefined && false){}
  if (e.target.id === 'tq'){ S.settings.tq = e.target.value; const b = $('#followTopic'); if (b) b.textContent = `Seguir “${e.target.value || '…'}” em ${flag(S.settings.tc || 'PT')} ${cname(S.settings.tc || 'PT')}`; }
});
document.addEventListener('scroll', e => { const el = e.target; if (!el.dataset || !el.dataset.dots) return;
  const dots = document.getElementById(el.dataset.dots); if (!dots) return;
  const w = el.firstElementChild ? el.firstElementChild.getBoundingClientRect().width + 12 : el.clientWidth;
  const i = Math.round(el.scrollLeft / w); [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i)); }, true);
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
$('#q').addEventListener('input', e => { query = e.target.value.trim(); tab = 'hoje'; render(); });

const darkMQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
darkMQ && darkMQ.addEventListener && darkMQ.addEventListener('change', () => applySettings());
function applySettings(){
  const t = S.settings.theme ?? 'auto';
  document.documentElement.dataset.theme = t === 'auto' ? (darkMQ && darkMQ.matches ? 'dark' : '') : t;
  document.documentElement.style.setProperty('--read-size', S.settings.size + 'px');
}
const TITLES = { hoje: 'Hoje', fontes: 'Feeds', interesses: 'Interesses', biblioteca: 'Biblioteca' };
function greet(){
  const d = new Date().toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
  $('#today').textContent = d[0].toUpperCase() + d.slice(1);
}


// barra compacta no topo + esconder a barra de baixo ao descer (um só handler, com requestAnimationFrame)
(() => { let last = 0, tick = false; const nav = document.getElementById('nav'), tb = document.getElementById('topbar');
  window.addEventListener('scroll', () => { if (tick) return; tick = true; requestAnimationFrame(() => { const y = window.scrollY;
    tb.classList.toggle('show', y > 46);
    if (y > last + 10 && y > 160) nav.classList.add('hide'); else if (y < last - 10 || y < 160) nav.classList.remove('hide');
    last = y; tick = false; }); }, { passive: true }); })();
// puxar para atualizar (ecrã Hoje)
(() => { let y0 = null, pulled = false; const p = document.getElementById('ptr');
  document.addEventListener('touchstart', e => { y0 = (tab === 'hoje' && window.scrollY <= 0 && !current && !chan && !document.getElementById('modal').classList.contains('open')) ? e.touches[0].clientY : null; pulled = false; }, { passive: true });
  document.addEventListener('touchmove', e => { if (y0 == null) return; const dy = e.touches[0].clientY - y0; if (dy > 80 && !pulled){ pulled = true; p.classList.add('on'); } }, { passive: true });
  document.addEventListener('touchend', async () => { if (y0 == null) return; y0 = null; if (!pulled) return; await refreshAll(true); p.classList.remove('on'); toast('Atualizado'); });
})();
if (window.__TAURI__ && /Android/i.test(navigator.userAgent)) document.documentElement.classList.add('android');
load(); applySettings(); greet(); render();
if (isApp){
  document.body.classList.add('is-app');
  // links externos abrem no navegador do sistema
  document.addEventListener('click', e => { const a = e.target.closest('a[target="_blank"]'); if (a){ e.preventDefault(); window.__TAURI__.opener?.openUrl(a.href); } }, true);
  // atualizar ao abrir e a cada 30 minutos
  refreshAll(true); setInterval(() => refreshAll(true), 30 * 60e3);
}
</script>
</body>
</html>
