name: Build Leitura

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 0.1.${{ github.run_number }}

jobs:
  windows:
    name: Windows (instalador)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: node scripts/set-version.mjs ${{ env.APP_VERSION }}
      - run: npx tauri icon app-icon.png
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Instalar NDK
        run: sdkmanager "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: node scripts/set-version.mjs ${{ env.APP_VERSION }}
      - name: Criar projeto Android
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: npx tauri android init --ci
      - run: npx tauri icon app-icon.png
      - name: Configurar assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Usa os segredos do GitHub se existirem; senão, a chave do repositório (keystore/leitura.jks)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/leitura.jks
          else
            cp keystore/leitura.jks $RUNNER_TEMP/leitura.jks
            KEYSTORE_PASSWORD=leitura-rss
            KEY_ALIAS=leitura
          fi
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          password=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/leitura.jks
          PROPS
          sed -i 's/^ *//' src-tauri/gen/android/keystore.properties
          python3 scripts/android-signing.py
      - name: Compilar APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: npx tauri android build --apk --target aarch64
      - name: Renomear APK
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -1)
          echo "APK encontrada: $APK"
          cp "$APK" Leitura-${{ env.APP_VERSION }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Leitura-*.apk

  release:
    name: Publicar versão
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Apagar versões antigas (fica sempre só a mais recente)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for t in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            gh release delete "$t" --cleanup-tag --yes || true
          done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Leitura ${{ env.APP_VERSION }}
          make_latest: true
          body: |
            Leitura ${{ env.APP_VERSION }}
            - Android: Leitura-${{ env.APP_VERSION }}.apk
            - Windows: instalador .exe
            Link fixo para o Obtainium: https://github.com/${{ github.repository }}
          files: |
            dist/android/*.apk
            dist/windows/*.exe
